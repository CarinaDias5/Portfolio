<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Pré-visualização de dashboard de e-commerce brasileiro</title>
  <desc id="desc">Pré-visualização abstrata de um dashboard Power BI com cartões de faturação, gráficos de barras e um gráfico de linhas.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8f7ff"/>
      <stop offset="1" stop-color="#cfcfea"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#e26d5a"/>
      <stop offset="1" stop-color="#8cffda"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#353a47" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="960" height="600" fill="#e7e6f7"/>
  <rect x="76" y="68" width="808" height="464" rx="8" fill="url(#panel)" filter="url(#softShadow)"/>
  <rect x="116" y="108" width="248" height="96" rx="8" fill="#ffffff" opacity="0.9"/>
  <rect x="394" y="108" width="160" height="96" rx="8" fill="#ffffff" opacity="0.78"/>
  <rect x="584" y="108" width="260" height="96" rx="8" fill="#353a47"/>
  <text x="140" y="147" fill="#353a47" font-family="Arial, sans-serif" font-size="20" font-weight="700">Faturação</text>
  <text x="140" y="178" fill="#e26d5a" font-family="Arial, sans-serif" font-size="30" font-weight="800">+100K</text>
  <text x="418" y="147" fill="#353a47" font-family="Arial, sans-serif" font-size="20" font-weight="700">Encomendas</text>
  <text x="418" y="178" fill="#353a47" font-family="Arial, sans-serif" font-size="30" font-weight="800">2018</text>
  <text x="616" y="146" fill="#cfcfea" font-family="Arial, sans-serif" font-size="19" font-weight="700">E-commerce</text>
  <text x="616" y="178" fill="#8cffda" font-family="Arial, sans-serif" font-size="30" font-weight="800">Desempenho</text>
  <rect x="116" y="242" width="342" height="226" rx="8" fill="#ffffff" opacity="0.9"/>
  <rect x="502" y="242" width="342" height="226" rx="8" fill="#ffffff" opacity="0.86"/>
  <g transform="translate(154 286)">
    <rect x="0" y="98" width="30" height="74" rx="4" fill="#e26d5a"/>
    <rect x="48" y="74" width="30" height="98" rx="4" fill="#cfcfea"/>
    <rect x="96" y="48" width="30" height="124" rx="4" fill="#8cffda"/>
    <rect x="144" y="28" width="30" height="144" rx="4" fill="#353a47"/>
    <rect x="192" y="68" width="30" height="104" rx="4" fill="#e26d5a"/>
    <rect x="240" y="18" width="30" height="154" rx="4" fill="#8cffda"/>
    <line x1="0" y1="174" x2="288" y2="174" stroke="#353a47" stroke-opacity="0.18" stroke-width="4"/>
  </g>
  <g transform="translate(538 290)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 140 C42 110 54 70 96 88 S168 152 220 92 S266 34 294 52" stroke="#e26d5a" stroke-width="12"/>
    <path d="M0 168 C54 150 78 130 126 132 S194 104 224 116 S270 148 304 118" stroke="#353a47" stroke-width="10" opacity="0.72"/>
    <circle cx="96" cy="88" r="10" fill="#8cffda" stroke="#353a47" stroke-width="5"/>
    <circle cx="220" cy="92" r="10" fill="#8cffda" stroke="#353a47" stroke-width="5"/>
  </g>
  <rect x="116" y="504" width="728" height="8" rx="4" fill="url(#accent)" opacity="0.82"/>
</svg>
